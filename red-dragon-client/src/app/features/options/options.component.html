<div class="page-content">
  <h2>{{ 'menu.options' | translate }}</h2>
  <app-notify-relay [message]="message"></app-notify-relay>

  <div *ngIf="!loading; else loadingTpl">
    <div class="card">
      <h3>{{ 'opt.coalition' | translate }}</h3>
      <ng-container *ngIf="kingdom?.coalitionId; else noCoalition">
        <p class="info">{{ 'opt.belongTo' | translate }}: <strong>{{ kingdom?.coalitionName }}</strong></p>
        <button class="btn-danger" (click)="leaveCoalition()">{{ 'pol.leave' | translate }}</button>
      </ng-container>
      <ng-template #noCoalition>
        <p class="info">{{ 'pol.needCoalition' | translate }}</p>
      </ng-template>
    </div>
  </div>

  <ng-template #loadingTpl><div class="loading">{{ 'common.loading' | translate }}</div></ng-template>
</div>

<div class="game-panel">
  <h2 class="panel-title">
    <img src="assets/img/role/zlodziej.png" [alt]="'thf.thief' | translate" class="title-icon">
    {{ 'menu.thieves' | translate }}
  </h2>

  <app-notify-relay [message]="message"></app-notify-relay>
  <app-notify-relay [message]="error" type="error"></app-notify-relay>
  <div class="loading" *ngIf="loading">{{ 'thf.loading' | translate }}</div>

  <p class="hint">{{ 'thf.hint' | translate }}</p>

  <table class="rd-table">
    <thead>
      <tr><th></th><th>{{ 'thf.action' | translate }}</th><th>{{ 'mag.desc' | translate }}</th><th>{{ 'thf.minThieves' | translate }}</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of actions" [class.selected]="a === selectedAction" (click)="select(a)">
        <td><input type="radio" name="action" [checked]="a === selectedAction"></td>
        <td class="action-name">{{ a.displayName }}</td>
        <td>{{ a.description }}</td>
        <td class="num">{{ a.thievesRequired }}</td>
      </tr>
    </tbody>
  </table>

  <div class="send-form">
    <label>
      {{ 'mag.target' | translate }}:
      <select [(ngModel)]="targetId">
        <option [ngValue]="undefined">{{ 'thf.chooseKingdom' | translate }}</option>
        <option *ngFor="let k of targets" [ngValue]="k.id">{{ k.name }} ({{ 'bld.acres' | translate:{ n: k.land } }})</option>
      </select>
    </label>
    <p class="hint" *ngIf="targets.length === 0">{{ 'thf.noWarTargets' | translate }}</p>
    <label>
      {{ 'thf.thievesCount' | translate }}:
      <input type="number" [(ngModel)]="thieves" min="1">
    </label>
    <button class="btn-send" (click)="send()" [disabled]="!selectedAction || !targetId">
      {{ 'thf.sendThieves' | translate }}
    </button>
  </div>
</div>

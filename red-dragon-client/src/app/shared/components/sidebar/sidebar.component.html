<nav class="sidebar">
  <div class="menu-buttons">
    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       class="menu-btn">
      {{ item.label | translate }}
    </a>
    <button type="button" class="menu-btn logout-btn" (click)="logout()">{{ 'menu.logout' | translate }}</button>
  </div>

  <div class="turn-button-container">
    <button type="button" class="turn-btn" (click)="onTurnClick()" [title]="'menu.useTurn' | translate">
      <div class="turn-circle-outer">
        <div class="turn-circle-inner"></div>
      </div>
    </button>
  </div>
</nav>
